version: '3.7'
services:
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    container_name: ultrafeeder
    devices:
    - /dev/bus/usb:/dev/bus/usb
    ports:
    - 1090:80
    - 30005:30005
    environment:
    - TZ=America/New_York
    - READSB_DEVICE_TYPE=rtlsdr
    - READSB_RTLSDR_DEVICE=0
    - READSB_LAT=29.020396
    - READSB_LON=-81.281632
    - READSB_ALT=33m
    - READSB_GAIN=auto
    - READSB_STATS_RANGE=true
    - ULTRAFEEDER_CONFIG= adsb,feed.airplanes.live,30004,beast_reduce_plus_out,uuid=6EA5C30F-6087-4D92-B79F-4C9CE075E4FF;
      mlat,feed.airplanes.live,31090,uuid=6EA5C30F-6087-4D92-B79F-4C9CE075E4FF
    - UPDATE_TAR1090=true
    - TAR1090_MESSAGERATEINTITLE=true
    - TAR1090_PAGETITLE=not-really-planes
    - TAR1090_PLANECOUNTINTITLE=true
    - TAR1090_ENABLE_AC_DB=true
    - TAR1090_FLIGHTAWARELINKS=true
    - TAR1090_SITESHOW=true
    - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
    - TAR1090_RANGE_OUTLINE_WIDTH=2.0
    - TAR1090_RANGERINGSDISTANCES=50,100,150,200
    - TAR1090_RANGERINGSCOLORS='#1A237E','#0D47A1','#42A5F5','#64B5F6'
    - TAR1090_USEROUTEAPI=true
    - GRAPHS1090_DARKMODE=true
    labels:
    - traefik.enable=true
    - traefik.http.routers.planes.entrypoints=websecure
    - traefik.http.routers.planes.tls.certresolver=letsEncrypt
    - traefik.http.routers.planes.rule=Host(`planes.not-really.me`)
    - traefik.http.services.planes.loadbalancer.server.port=80
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  rickroll:
    image: modem7/docker-rickroll
    container_name: Rickroll
    ports:
    - 1987:8080
    environment:
    - TITLE="not-really-roll"
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.rr.entrypoints=websecure
    - traefik.http.routers.rr.tls.certresolver=letsEncrypt
    - traefik.http.routers.rr.rule=Host(`rr.not-really.me`)
    - traefik.http.services.rr.loadbalancer.server.port=8080
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
    - 1234:8080
    volumes:
    - /volume2/docker-configs/searxng:/etc/searxng:rw
    environment:
    - PUID=1000
    - PGID=100
    - TZ=America/New_York
    - SEARXNG_BASE_URL=https://search.not-really.me/
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '1'
    healthcheck:
      test:
      - NONE
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.search.entrypoints=websecure
    - traefik.http.routers.search.tls.certresolver=letsEncrypt
    - traefik.http.routers.search.rule=Host(`search.not-really.me`)
    - traefik.http.services.search.loadbalancer.server.port=8080
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
    - PUID=1000
    - PGID=100
    - TZ=America/New_York
    - DOCKER_MODS=linuxserver/mods:universal-calibre
    - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
    - /volume2/docker-configs/calibre-web/config:/config
    - /volume1/files/books/:/books
    networks:
    - traefik-public
    ports:
    - 8083:8083
    labels:
    - traefik.enable=true
    - traefik.http.routers.books.entrypoints=websecure
    - traefik.http.routers.books.tls.certresolver=letsEncrypt
    - traefik.http.routers.books.rule=Host(`books.not-really.me`)
    - traefik.http.services.books.loadbalancer.server.port=8083
    - traefik.docker.network=traefik-public
    - traefik.port=8083
    restart: unless-stopped
  openspeedtest:
    image: openspeedtest/latest:latest
    container_name: openspeedtest
    environment:
    - MODE=standalone
    - PUID=1000
    - PGID=1000
    - PORT=3000
    volumes:
    - /volume2/docker-configs/openspeedtest:/app/data
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.speed.entrypoints=websecure
    - traefik.http.routers.speed.tls.certresolver=letsEncrypt
    - traefik.http.routers.speed.rule=Host(`speed.not-really.me`)
    - traefik.http.services.speed.loadbalancer.server.port=3000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  gitea:
    image: docker.io/gitea/gitea:latest
    container_name: gitea
    volumes:
    - /volume2/docker-configs/gitea:/data
    ports:
    - '2222:22'
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.gitea.entrypoints=websecure
    - traefik.http.routers.gitea.tls.certresolver=letsEncrypt
    - traefik.http.routers.gitea.rule=Host(`git.not-really.me`)
    - traefik.http.services.gitea.loadbalancer.server.port=3000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  duckiesays:
    image: registry.not-really.me/caduffy/duckiesays:v25-dt
    container_name: duckiesays
    environment:
    - NODE_ENV=production
    volumes:
    - /volume2/docker-configs/duckiesays/logs:/usr/src/app/logs
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.duckiesays.entrypoints=websecure
    - traefik.http.routers.duckiesays.tls.certresolver=letsEncrypt
    - traefik.http.routers.duckiesays.rule=Host(`duckiesays.com`) || Host(`www.duckiesays.com`)
    - traefik.http.routers.duckiesays.priority=100
    - traefik.http.services.duckiesays.loadbalancer.server.port=3000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  duckiesays-legacy:
    image: docker.io/cadeon924/duckiesays-legacy:latest
    container_name: duckiesays-legacy
    environment:
    - NODE_ENV=production
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.duckiesays-legacy.entrypoints=websecure
    - traefik.http.routers.duckiesays-legacy.tls.certresolver=letsEncrypt
    - traefik.http.routers.duckiesays-legacy.rule=Host(`legacy.duckiesays.com`)
    - traefik.http.routers.duckiesays-legacy.priority=100
    - traefik.http.services.duckiesays-legacy.loadbalancer.server.port=3000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  saas:
    image: docker.io/cadeon924/saas:v12
    container_name: saas
    environment:
    - LLM_API_URL=https://llm.not-really.me/v1/chat/completions
    - LLM_MODEL=ripper
    volumes:
    - saas-data:/opt/data/saas-exchanges
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.saas.entrypoints=websecure
    - traefik.http.routers.saas.tls.certresolver=letsEncrypt
    - traefik.http.routers.saas.rule=Host(`saas.not-really.me`)
    - traefik.http.services.saas.loadbalancer.server.port=8000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  registry:
    image: docker.io/library/registry:2
    container_name: registry
    volumes:
    - /volume2/docker-configs/registry/data:/var/lib/registry
    environment:
    - REGISTRY_STORAGE_DELETE_ENABLED=true
    - REGISTRY_HTTP_ADDR=0.0.0.0:5000
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.registry-http.entrypoints=web
    - traefik.http.routers.registry-http.rule=Host(`registry.not-really.me`)
    - traefik.http.routers.registry.entrypoints=websecure
    - traefik.http.routers.registry.tls.certresolver=letsEncrypt
    - traefik.http.routers.registry.rule=Host(`registry.not-really.me`)
    - traefik.http.services.registry.loadbalancer.server.port=5000
    - traefik.docker.network=traefik-public
    restart: unless-stopped
  registry-ui:
    image: docker.io/joxit/docker-registry-ui:latest
    container_name: registry-ui
    restart: unless-stopped
    environment:
    - SINGLE_REGISTRY=true
    - REGISTRY_TITLE=Local Registry
    - DELETE_IMAGES=true
    - SHOW_CONTENT_DIGEST=true
    - NGINX_PROXY_PASS_URL=http://registry:5000
    - REGISTRY_SECURED=false
    depends_on:
    - registry
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.registry-ui.entrypoints=websecure
    - traefik.http.routers.registry-ui.tls.certresolver=letsEncrypt
    - traefik.http.routers.registry-ui.rule=Host(`registry-ui.not-really.me`)
    - traefik.http.routers.registry-ui-http.entrypoints=web
    - traefik.http.routers.registry-ui-http.rule=Host(`registry-ui.not-really.me`)
    - traefik.http.services.registry-ui.loadbalancer.server.port=80
    - traefik.docker.network=traefik-public
  # Config: /volume2/docker-configs/copyparty/copyparty.conf (accounts/volumes).
  # No CLI -v/-a — those conflict with the conf (two paths at webroot /).
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    user: "1000:100"
    environment:
    - TZ=America/New_York
    - PYTHONUNBUFFERED=1
    volumes:
    - /volume2/docker-configs/copyparty:/cfg
    - /volume1/files/public:/files/public
    - /volume1/plex-media:/files/plex-media
    - /volume1/files/warez:/files/warez
    - /volume1/files/imgs/imgs:/files/imgs
    healthcheck:
      # hide from logs with "/._" so it matches the default --lf-url filter
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
    networks:
    - traefik-public
    labels:
    - traefik.enable=true
    - traefik.http.routers.filez.entrypoints=websecure
    - traefik.http.routers.filez.tls.certresolver=letsEncrypt
    - traefik.http.routers.filez.rule=Host(`filez.not-really.me`)
    - traefik.http.services.filez.loadbalancer.server.port=3923
    - traefik.docker.network=traefik-public
    stop_grace_period: 15s
    restart: unless-stopped
networks:
  traefik-public: {}
volumes:
  saas-data: {}
