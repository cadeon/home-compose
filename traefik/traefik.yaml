serversTransport:
  maxIdleConnsPerHost: -1
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0s
    idleConnTimeout: 180s

providers:
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"
    network: traefik-public
    # Route to container IPs on traefik-public (host-network Traefik can
    # still reach them). useBindPortIP would bounce through docker-proxy.
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  insecure: true
  dashboard: true

entryPoints:
  # Insecure dashboard — localhost only (was :8080 on every interface)
  traefik:
    address: "127.0.0.1:8080"

  # HTTP → redirect to HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s

  # HTTPS — all services
  # Exposure controlled by DNS, not by entrypoint
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s

certificatesResolvers:
  letsEncrypt:
    acme:
      storage: /etc/traefik/acme.json
      email: cadeon924@gmail.com
      dnsChallenge:
        provider: digitalocean
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

accessLog:
  filePath: "/var/log/access.log"
  bufferingSize: 2000

log:
  level: INFO
