  # Commented out for TrueNAS migration
  # openspeedtest:
  #   image: openspeedtest/latest:latest
  #   container_name: openspeedtest
  #   environment:
  #   - MODE=standalone
  #   - PUID=1000
  #   - PGID=1000
  #   - PORT=3000
  #   volumes:
  #   - /volume2/docker-configs/openspeedtest:/app/data
  #   networks:
  #   - traefik-public
